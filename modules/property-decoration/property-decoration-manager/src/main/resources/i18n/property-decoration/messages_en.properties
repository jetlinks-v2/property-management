message.decoration.notice.title=Decoration progress
message.decoration.notice.submitted=Your application has been submitted. Wait for the property team to review all items before paying.
message.decoration.notice.rejected=Some items were rejected. Read the review comments and resubmit the required documents.
message.decoration.notice.reviewed=All application items have passed review. Please pay the decoration fees.
message.decoration.notice.paid=Payment is confirmed. Contact the property team to obtain your decoration permit.
message.decoration.notice.permitReady=Your permit is ready. Request the first inspection when the property is ready.
message.decoration.notice.permitExtended=Your permit has been extended. Contact the property team to print or download and collect the renewed permit.
message.decoration.notice.firstRequested=The first inspection has been requested. Wait for the property team to assign an inspector.
message.decoration.notice.secondRequested=The second inspection has been requested. Wait for the property team to assign an inspector.
message.decoration.notice.firstAssigned=An inspector has been assigned for the first inspection. View the arrangements and wait for the result.
message.decoration.notice.secondAssigned=An inspector has been assigned for the second inspection. View the arrangements and wait for the result.
message.decoration.notice.firstFailed=The first inspection did not pass. Rectify the issues and request another inspection.
message.decoration.notice.secondFailed=The second inspection did not pass. Rectify the issues and request another inspection.
message.decoration.notice.firstPassed=The first inspection has passed. Request the second inspection when ready.
message.decoration.notice.secondPassed=The second inspection has passed. Request the one-time refund. Decoration completes only after refund confirmation.
message.decoration.notice.finished=The refund is complete and this decoration is finished. View its full history in decoration records.

error.decoration.assignee_member_limit=The application exceeds 10000 accessible members; ask the application administrator to narrow its member scope

