# 加载到认证服务；先导入菜单，再创建/更新模板。
jetlinks:
  business-application:
    template:
      initialize:
        enabled: true
        custom-templates:
          - template:
              id: cloud-patrol
              code: CloudPatrol
              name: 智能巡更
              provider: official
              description: 巡更配置、计划、排班、任务与执行记录
              sort-index: 75
            menus:
              - id: patrol-system
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-OrganizationType
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: sync, granted: true}
                  - {id: bind, granted: true}
                  - {id: spaceSync, granted: true}
              - id: patrol-User
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: sync, granted: true}
              - id: patrol-Space
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
                  - {id: import, granted: true}
                  - {id: export, granted: true}
                  - {id: sync, granted: true}
              - id: patrol-Customer
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
                  - {id: import, granted: true}
                  - {id: export, granted: true}
              - id: patrol-Dictionary
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
              - id: patrol-base
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-point-management
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-record-management
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-statistics
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-categories
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
              - id: patrol-points
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: posts, granted: true}
                  - {id: assign, granted: true}
                  - {id: importRoster, granted: true}
              - id: patrol-standards
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
              - id: patrol-records
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: mobile, granted: true}
                  - {id: applyMissed, granted: true}
                  - {id: auditMissed, granted: true}
              - id: patrol-levels
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
              - id: patrol-warnings
                owner: app
                options: {appName: cloud-patrol}
                granted: true
                buttons:
                  - {id: save, granted: true}
                  - {id: delete, granted: false}
              - id: patrol-calendar
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-coverage
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-qualification
                owner: app
                options: {appName: cloud-patrol}
                granted: true
              - id: patrol-personnel
                owner: app
                options: {appName: cloud-patrol}
                granted: true
            asset-accesses:
              - asset-type: patrolCategory
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolPoint
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolStandard
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolPost
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolRoster
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolPlan
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolAttachment
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: user
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT}
              - asset-type: patrolLevel
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolTag
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
              - asset-type: patrolWarning
                accesses: [{supportId: business_application}]
                options: {scopeStrategy: SELECT_AND_BIND}
