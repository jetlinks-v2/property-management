server:
  port: ${SERVER_PORT:8502}
spring:
  profiles:
    default: default
  application:
    name: cloud-patrol-service
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:cloud_patrol}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      max-size: 32
      max-acquire-time: 10s
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
easyorm:
  default-schema: ${DB_SCHEMA:public}
  dialect: postgres
hsweb:
  webflux:
    response-wrapper:
      enabled: true
      excludes: [org.springdoc]
  authorize:
    auto-parse: true
  cache:
    type: redis
    redis:
      local-cache-type: caffeine
jetlinks:
  server-id: ${SERVER_ID:cloud-patrol-service-1}
  cluster:
    id: ${jetlinks.server-id}
    name: ${spring.application.name}
    port: ${CLUSTER_PORT:18502}
    external-host: ${CLUSTER_EXTERNAL_HOST}
    external-port: ${CLUSTER_EXTERNAL_PORT:18502}
    rpc-port: ${RPC_PORT:28502}
    rpc-external-host: ${RPC_EXTERNAL_HOST:${CLUSTER_EXTERNAL_HOST}}
    rpc-external-port: ${RPC_EXTERNAL_PORT:28502}
    rpc-token: ${RPC_TOKEN}
    seeds: ${CLUSTER_SEEDS}
    event-namespace: cloud-patrol
    config-storage-namespace: cloud-patrol
    namespace: default,cloud-patrol
  microservice:
    discovery:
      enabled: true
    token:
      jwt:
        decode-key: ${JWT_PUBLIC_KEY}
springdoc:
  group-configs:
    - group: cloud-patrol
      packages-to-scan: [org.jetlinks.pro.patrol.web]
