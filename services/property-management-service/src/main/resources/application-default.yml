# 注意：本地开发时，请在本目录创建 application-local.yml 进行配置。
# 不要随意修改 application-default.yml；下面均为注释示例，填写实际值后放入本地配置。
# application-local.yml 已被 Git 忽略，并在生成发布 JAR 时排除。
# 物业服务复用 SaaS 登录，管理员账号及初始密码由 SaaS 认证服务维护。

#超级管理员初始密码
ADMIN_USER_PASSWORD: HT@@sv2Pd0

# PostgreSQL 数据库配置
DB_HOST: 127.0.0.1 # 数据库地址，本机连接 Docker 映射地址
DB_PORT: 5432 # 数据库端口
DB_DATABASE: jetlinks # 数据库名称
DB_USERNAME: postgres # 数据库连接用户名
DB_PASSWORD: "填写实际数据库密码" # 与 Docker PostgreSQL 配置一致
DB_SCHEMA: public # 业务表所在的 schema

# Redis 配置
REDIS_HOST: 127.0.0.1 # Redis 地址，本机连接 Docker 映射地址
REDIS_PORT: 6379 # Redis 端口
REDIS_PASSWORD: "填写实际 Redis 密码" # 与 Docker Redis 配置一致
REDIS_DATABASE: 0 # 逻辑库编号，与 SaaS 运行端保持一致

# 集群配置：节点之间的 HOST 和 PORT 必须能够双向访问
CLUSTER_EXTERNAL_HOST: "填写宿主机地址" # Docker 与本机均能访问的物业服务地址
CLUSTER_EXTERNAL_PORT: ${jetlinks.cluster.port} # 集群对外端口，默认 1${server.port}，当前为 18503

# RPC 配置
RPC_EXTERNAL_HOST: ${CLUSTER_EXTERNAL_HOST} # 其他节点回连物业服务 RPC 的地址
RPC_EXTERNAL_PORT: ${jetlinks.cluster.rpc-port} # RPC 对外端口，默认 2${server.port}，当前为 28503
RPC_TOKEN: "填写 SaaS 运行端 RPC 通信密钥" # 必须与 SaaS 运行端各节点一致

# 集群种子节点：通常为 SaaS 网关的集群地址，多个地址以逗号分隔
CLUSTER_SEEDS: 127.0.0.1:18800
# 本机切换网络后运行 deploy/enable-host-dev.ps1，更新本地配置的两个 HOST 并同步 Docker。
# 更新后重新编译并重启物业服务。

# JWT 配置
JWT_PUBLIC_KEY: "填写 SaaS 认证服务对应的 JWT 公钥" # 用于校验平台传递的 JWT 身份凭证
# JWT 私钥只配置在 SaaS 认证服务，物业服务不配置私钥。
