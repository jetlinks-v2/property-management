# 本地开发请在本目录创建 application-local.yml，按下面的连接变量填写实际值。
# 本文件仅提供注释示例，不包含本机密码或密钥。
# DB_HOST: 127.0.0.1
# DB_PORT: 5432
# DB_DATABASE: jetlinks
# DB_USERNAME: postgres
# DB_PASSWORD: "填写本机 PostgreSQL 密码"
# DB_SCHEMA: public
# REDIS_HOST: 127.0.0.1
# REDIS_PORT: 6379
# REDIS_PASSWORD: "填写本机 Redis 密码"
# REDIS_DATABASE: 0
# CLUSTER_SEEDS: 127.0.0.1:18800
# RPC_TOKEN: "与 SaaS 运行端一致"
# JWT_PUBLIC_KEY: "与 authentication-service 的 JWT_PUBLIC_KEY 一致"

# IDEA 连接 Docker SaaS 时，容器需能回连这些注册地址。
# CLUSTER_EXTERNAL_HOST: "填写 enable-host-dev.ps1 输出的宿主机地址"
# RPC_EXTERNAL_HOST: "填写相同宿主机地址"
